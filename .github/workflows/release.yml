name: goreleaser

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # packages: write
  # issues: write

jobs:
  goreleaser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Fetch all tags
        run: git fetch --force --tags
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.19
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Generate Release Notes
        run: python ./.github/scripts/generate-release-notes.py # outputs a file named "changelog-temp.md"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v2
        with:
          distribution: goreleaser
          version: latest
          args: release --release-notes changelog-temp.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Trigger kaizoku image build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh api repos/${{ github.repository_owner }}/kaizoku/dispatches \
            -f event_type=mangal-release \
            -f "client_payload[mangal_version]=${GITHUB_REF_NAME}"
